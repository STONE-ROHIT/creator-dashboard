# render.yaml — Deploy backend to Render.com
# Docs: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: creator-dashboard-api
    runtime: node
    region: singapore         # closest to India
    plan: free                # upgrade to starter for production
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: creator-dashboard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render generates a secure random value
      - key: RAZORPAY_KEY_ID
        sync: false           # Set manually in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false           # Set to your Vercel frontend URL

databases:
  - name: creator-dashboard-db
    plan: free
    databaseName: creator_dashboard
    region: singapore